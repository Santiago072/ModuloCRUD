version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: modulocrud_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-modulocrud}
      MYSQL_USER: ${DB_USER:-crud_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
      - ./BD.txt:/docker-entrypoint-initdb.d/BD.txt:ro  # Inicializa la BD automáticamente
    networks:
      - crud_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modulocrud_backend
    restart: always
    ports:
      - "127.0.0.1:8894:3000"  # Puerto 8894 host → 3000 interno (8893=frontend, 8894=backend)
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-crud_user}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-modulocrud}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-supersecret_modulocrud_key_2026_jwt_token_auth_secret}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://modulocrud.slscode.online,http://localhost:8893,http://localhost:5173,http://localhost:3000,http://127.0.0.1:8893,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crud_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://modulocrud.slscode.online/api}

    container_name: modulocrud_frontend
    restart: always
    ports:
      - "127.0.0.1:8893:80"  # Solo accesible por Nginx en el host (Puerto 8893)
    networks:
      - crud_network

volumes:
  db_data:
    name: modulocrud_db_data  # Nombre explícito para no confundir con otros proyectos

networks:
  crud_network:
    driver: bridge
